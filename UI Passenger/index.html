<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Status | HK Express (Hackathon Prototype)</title>
  <!-- Inline SVG favicon so no extra file/request is needed under Live Server -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236b2fa0'/%3E%3Ctext x='50' y='67' font-family='Arial,Helvetica,sans-serif' font-size='46' font-weight='bold' text-anchor='middle' fill='white'%3EUO%3C/text%3E%3C/svg%3E" />

<body>

  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->
  <main class="page">
    <p class="page-eyebrow" id="pageEyebrow">Flight Status</p>
    <h1 class="page-title" id="pageTitle">Hong Kong (HKG) To Ningbo (NGB)</h1>
    <div class="flight-selector">
      <label for="flightNumberInput" id="flightNumberLabel">Flight number</label>
      <input id="flightNumberInput" type="text" maxlength="10" autocomplete="off" placeholder="e.g. UO612" />
    </div>
    <p class="page-meta">
      <span id="lastUpdated"></span>
      <span class="translated-chip" id="translatedChip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
        </svg>
        <span id="translatedChipText"></span>
      </span>
      <button class="btn-refresh" type="button" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 4v5h-5"/>
        </svg>
        <span class="btn-label" id="refreshLabel">Refresh Status</span>
      </button>
    </p>

    <div class="content" id="content" aria-busy="false">
      <!-- 1. Large status card (sticky, shrinks on scroll) -->
      <section class="hero" id="hero" aria-live="polite"></section>

      <!-- 2. Reason for delay / cancellation (always shown first) -->
      <section class="reason-card" id="reasonCard"></section>

      <!-- 3. Everything else -->
      <h2 class="section-title" id="detailsTitle">Flight details</h2>
      <section id="flightsContainer"></section>
    </div>
  </main>

  <!-- =========================================================
       FLOATING TRANSLATION BUBBLE
       ========================================================= -->
  <div class="translate-fab" id="translateFab">
    <div class="lang-menu" id="langMenu" role="menu" aria-labelledby="fabBtn">
      <div class="lang-menu-head">
        <p class="lang-menu-title" id="langMenuTitle">Translate flight info</p>
        <p class="lang-menu-sub" id="langMenuSubtitle">Powered by Google Cloud Translation</p>
      </div>
      <button class="lang-option" type="button" role="menuitemradio" data-lang="en" aria-checked="true">
        <span><span id="langNameEnglish">English</span> <small>EN</small></span>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
      </button>
      <button class="lang-option" type="button" role="menuitemradio" data-lang="zh-TW" aria-checked="false">
        <span>繁體中文 <small id="langNameChinese">Traditional Chinese</small></span>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
      </button>
      <button class="lang-option" type="button" role="menuitemradio" data-lang="ja" aria-checked="false">
        <span>日本語 <small id="langNameJapanese">Japanese</small></span>
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
      </button>
    </div>

    <button class="fab-btn" id="fabBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu" title="Translate">

        <path d="M3 12h18"/>
        <path d="M12 3a14 14 0 0 1 0 18"/>
        <path d="M12 3a14 14 0 0 0 0 18"/>

    </button>

  <dialog class="compensation-dialog" id="compensationDialog" aria-labelledby="compensationTitle">
    <form id="compensationForm">
      <div class="compensation-head">
        <div>
          <h2 id="compensationTitle"></h2>
          <p id="compensationIntro"></p>
        </div>
        <button class="compensation-close" id="compensationClose" type="button" aria-label="Close">×</button>
      </div>

      <fieldset class="compensation-options" id="compensationOptions"></fieldset>
      <button class="compensation-submit" id="compensationSubmit" type="submit"></button>
    </form>
  </dialog>

        '<path d="M21.5 15.5v-1.8l-8-5V3.2c0-.8-.7-1.5-1.5-1.5s-1.5.7-1.5 1.5v5.5l-8 5v1.8l8-2.5v5.3L8.5 19.8v1.5l3.5-1 3.5 1v-1.5l-2-1.5V13l8 2.5z" transform="rotate(90 12 12)"/>' +
        '</svg>',
      dotted:
        '<svg class="dotted" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true">' +
        '<line x1="2" y1="3" x2="98" y2="3" stroke="currentColor" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
        '</svg>',
      pin:
        '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/>' +
        '<circle cx="12" cy="9.5" r="2.5"/>' +
        '</svg>',
      check:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>',
      clock:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
      alert:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4L12 3.5z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/></svg>'
    };
    const SEVERITY_ICON = { green: 'check', yellow: 'clock', red: 'alert' };

    /* =========================================================
       HELPERS
       ========================================================= */
    function t(key) {
      const dict = TRANSLATIONS[state.language] || TRANSLATIONS.en;
      const apiDict = state.apiTranslations[state.language];
      if (apiDict && apiDict[key] !== undefined) return apiDict[key];
      return dict[key] !== undefined ? dict[key] : (TRANSLATIONS.en[key] !== undefined ? TRANSLATIONS.en[key] : key);
    }

    function fill(template, values) {
      return String(template).replace(/\{(\w+)\}/g, function (_, k) {
        return values[k] !== undefined ? values[k] : '';
      });
    }

    function cityLabel(place) {
      return place.cityKey ? t(place.cityKey) : (place.name || place.code);
    }

    function normalizeFlightNumber(value) {
      return String(value || '').replace(/\s+/g, '').toUpperCase();
    }

    function readControllerUpdate(flightNumber) {
      const target = normalizeFlightNumber(flightNumber);
      const prefix = 'hkexpress:flight:';
      let latest = null;
      let malformed = false;

      function parseUpdate(raw) {
        try {
          const value = JSON.parse(raw);
          if (!value || normalizeFlightNumber(value.flightNumber) !== target ||
              !value.route || !['on_time', 'delayed', 'cancelled'].includes(value.status) ||
              !['GREEN', 'YELLOW', 'RED'].includes(value.statusColour)) return null;
          return value;
        } catch (error) {
          malformed = true;
          return null;
        }
      }

      const latestRaw = localStorage.getItem(prefix + 'latest');
      if (latestRaw) latest = parseUpdate(latestRaw);

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith(prefix) || key === prefix + 'latest') continue;
        const keyFlight = key.slice(prefix.length).split('|')[0];
        if (normalizeFlightNumber(keyFlight) !== target) continue;
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const value = parseUpdate(raw);
        if (value && (!latest || String(value.sentAt || '') > String(latest.sentAt || ''))) latest = value;
      }

      if (malformed) showToast('A published flight update could not be read.');
      return latest;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(isoDate) {
      try {
        const d = new Date(isoDate + 'T00:00:00Z');
        return new Intl.DateTimeFormat(t('locale'), {
          weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'
        }).format(d);
      } catch (e) {
        return isoDate;
      }
    }

    function formatClock(date) {
      try {
        return new Intl.DateTimeFormat(t('locale'), { hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
      } catch (e) {
        return date.toTimeString().slice(0, 5);
      }
    }

    function toMinutes(hhmm) {
      const parts = hhmm.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function diffMinutes(scheduled, time) {
      if (!scheduled || !time) return 0;
      return toMinutes(time) - toMinutes(scheduled);
    }

    function delayInfo(scheduled, time) {
      const diff = diffMinutes(scheduled, time);
      if (!time || diff === 0) return { cls: '', label: '' };
      return {
        cls: diff > 0 ? 'is-late' : 'is-early',
        label: (diff > 0 ? '+' : '−') + Math.abs(diff) + ' ' + t('min')
      };
    }

    /* Largest positive delay across departure and arrival. */
    function maxDelay(f) {
      if (Number.isFinite(f.delayMinutes)) return Math.max(0, f.delayMinutes);
      return Math.max(
        0,
        diffMinutes(f.departure.scheduled, f.departure.time),
        diffMinutes(f.arrival.scheduled, f.arrival.time)
      );
    }

    /* green / yellow / red */
    function getSeverity(f) {
      if (f.statusColour) {
        return { GREEN: 'green', YELLOW: 'yellow', RED: 'red' }[f.statusColour] || 'red';
      }
      if (f.status === 'cancelled' || f.status === 'diverted') return 'red';
      const d = maxDelay(f);
      if (d > THRESHOLDS.LONG_DELAY) return 'red';
      if (d > THRESHOLDS.ON_TIME) return 'yellow';
      return 'green';
    }

    function getStatusKey(f) {
      if (f.status === 'cancelled') return 'statusCancelled';
      if (f.status === 'diverted') return 'statusDiverted';
      if (f.status === 'delayed') return 'statusDelayed';
      return maxDelay(f) > THRESHOLDS.ON_TIME ? 'statusDelayed' : 'statusOnTime';
    }

    function getCurrentFlight() {
      const base = MOCK_DATA[0];
      if (!base) return null;
      const update = state.publishedUpdate;
      if (update) {
        const delay = Number.isFinite(update.delayMinutes) ? update.delayMinutes : null;
        const isLongDelay = (delay !== null && delay > THRESHOLDS.LONG_DELAY) ||
          (delay === null && update.statusColour === 'RED');
        const reasonKey = update.status === 'cancelled'
          ? 'cancelled'
          : update.status === 'on_time'
            ? 'ontime'
            : isLongDelay ? 'long' : 'short';
        const languageKey = state.language === 'zh-TW' ? 'zh' : state.language;
        const passengerMessage = update.passengerMessage;
        const publishedMessage = typeof passengerMessage === 'string'
          ? passengerMessage
          : passengerMessage && (passengerMessage[languageKey] || passengerMessage.en);
        const controllerMessage = state.apiControllerMessages[state.language] || publishedMessage;
        const date = update.newDepartureDate || update.date || base.departure.date;
        return {
          id: 'published',
          flightNo: update.flightNumber,
          origin: { code: update.route.from || 'HKG', cityKey: (update.route.from || 'HKG') === 'HKG' ? 'cityHKG' : null },
          destination: { code: update.route.to || base.destination.code, name: update.route.toName || update.route.to || base.destination.code },
          departure: {
            date: date,
            scheduled: update.scheduledDeparture || base.departure.scheduled,
            time: update.status === 'cancelled' ? null : (update.newDeparture || null),
            timeType: 'estimated'
          },
          arrival: { date: date, scheduled: '—', time: null, timeType: 'estimated' },
          status: update.status === 'cancelled' ? 'cancelled' : update.status === 'delayed' ? 'delayed' : 'scheduled',
          statusColour: update.statusColour,
          delayMinutes: delay,
          controllerEntitlements: Array.isArray(update.entitlements) ? update.entitlements : [],
          reasonKey: reasonKey,
          controllerMessage: controllerMessage || ''
        };
      }
      const s = SCENARIOS[state.scenario];
      if (!s) return base;
      return Object.assign({}, base, {
        flightNo: state.flightNumber,
        status: s.status,
        reasonKey: s.reasonKey,
        departure: Object.assign({}, base.departure, s.dep),
        arrival: Object.assign({}, base.arrival, s.arr)
      });
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('is-visible');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(function () {
        els.toast.classList.remove('is-visible');
      }, 2200);
    }

    function updateCompensationPrompt(f) {
      const entitlementKeys = {
        asia_miles_500: 'compEntAsiaMiles',
        meal_voucher_80: 'compEntMealVoucher',
        free_change: 'compEntFreeChange',
        rebooking: 'compEntRebooking',
        refund: 'compEntRefund',
        hotel: 'compEntHotel',
        travel_voucher: 'compEntTravelVoucher'
      };
      const demoOptionKeys = {
        short: ['compShort1', 'compShort2'],
        long: ['compLong1', 'compLong2', 'compLong3', 'compLong4'],
        cancelled: ['compCancelled1', 'compCancelled2', 'compCancelled3', 'compCancelled4']
      };
      const hasPublishedEntitlements = Array.isArray(f.controllerEntitlements);
      const optionKeys = hasPublishedEntitlements
        ? f.controllerEntitlements.map(function (key) { return entitlementKeys[key]; }).filter(Boolean)
        : (demoOptionKeys[f.reasonKey] || []);
      const promptKey = [f.flightNo, f.reasonKey, optionKeys.join(',')].join(':');

      if (!optionKeys.length) {
        lastCompensationReason = promptKey;
        if (els.compensationDialog.open) els.compensationDialog.close();
        return;
      }

      const shouldOpen = lastCompensationReason !== promptKey;
      lastCompensationReason = promptKey;
      els.compensationTitle.textContent = t('compTitle');
      els.compensationIntro.textContent = t('compIntro');
      els.compensationDisclaimer.textContent = t(hasPublishedEntitlements ? 'compPublishedDisclaimer' : 'compDisclaimer');
      els.compensationSubmit.textContent = t('compSubmit');
      els.compensationClose.setAttribute('aria-label', t('compClose'));
      els.compensationOptions.innerHTML = optionKeys.map(function (key, index) {
        return '<label class="compensation-option">' +
          '<input type="radio" name="supportOption" value="' + index + '" required>' +
          '<span>' + escapeHtml(t(key)) + '</span>' +
        '</label>';
      }).join('');
      if (shouldOpen && !els.compensationDialog.open) els.compensationDialog.showModal();
    }

    function field(label, valueHtml, extraClass) {
      return (
        '<div class="field">' +
          '<span class="field-label">' + escapeHtml(label) + '</span>' +
          '<span class="field-value ' + (extraClass || '') + '">' + valueHtml + '</span>' +
        '</div>'
      );
    }

    /* =========================================================
       HERO (large status card)
       ========================================================= */
    function heroTimeBlock(kind, leg, airportCode, cityName, alignClass, isCancelled) {
      const typeLabel = isCancelled ? '' : ' · ' + (leg.timeType === 'actual' ? t('actual') : t('estimated'));
      const shown = leg.time || '—';
      const hasScheduledTime = leg.scheduled && leg.scheduled !== '—';
      const changed = hasScheduledTime && (!leg.time || leg.time !== leg.scheduled);
      const was = changed ? escapeHtml(fill(t('was'), { time: leg.scheduled })) : '&nbsp;';
      return (
        '<div class="' + alignClass + '">' +
          '<div class="ht-label">' + escapeHtml(t(kind) + typeLabel) + '</div>' +
          '<div class="ht-time">' + escapeHtml(shown) + '</div>' +
          '<div class="ht-was">' + (changed ? '<s>' + was + '</s>' : was) + '</div>' +
          '<div class="ht-code">' + escapeHtml(airportCode + ' · ' + cityName) + '</div>' +
        '</div>'
      );
    }

    function buildHero(f, sev) {
      const delay = maxDelay(f);
      let sub = f.status === 'delayed'
        ? t('sev_' + (f.reasonKey === 'long' ? 'red' : 'yellow'))
        : t('sev_' + sev);
      if (f.status === 'delayed' && delay > 0) {
        sub += ' · +' + delay + ' ' + t('min');
      }
      const isCancelled = f.status === 'cancelled';

      return (
        '<div class="hero-main">' +
          '<div class="hero-left">' +
            '<div class="hero-flight">' +
              '<span>' + escapeHtml(f.origin.code + ' → ' + f.destination.code) + '</span><span aria-hidden="true">·</span>' +
              '<span>' + escapeHtml(formatDate(f.departure.date)) + '</span>' +
            '</div>' +
            '<div class="hero-headline">' +
              '<span class="hero-flight-number">' + escapeHtml(f.flightNo) + '</span>' +
              '<span class="hero-status">' + escapeHtml(t(getStatusKey(f))) + '</span>' +
              '<span class="hero-sub">' + escapeHtml(sub) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="hero-icon">' + ICONS[SEVERITY_ICON[sev]] + '</div>' +
        '</div>' +
        '<div class="hero-times">' +
          heroTimeBlock('departure', f.departure, f.origin.code, cityLabel(f.origin), 'ht-dep', isCancelled) +
          '<div class="ht-line">' + ICONS.plane + ICONS.dotted + ICONS.pin + '</div>' +
          heroTimeBlock('arrival', f.arrival, f.destination.code, cityLabel(f.destination), 'ht-arr', isCancelled) +
        '</div>'
      );
    }

    /* =========================================================
       REASON CARD
       TODO (production): fetch reason text from a Google Cloud Vertex AI endpoint, e.g.
       POST https://{region}-aiplatform.googleapis.com/v1/projects/{project}/locations/{region}/publishers/google/models/{model}:generateContent
       with flight ops context (weather, ATC, inbound aircraft) and return a headline + 1-line advice.
       ========================================================= */
    function buildReason(f, sev) {
      const title = sev === 'green' ? t('reasonTitleOk') : t('reasonTitleIssue');
      const delay = maxDelay(f);
      const progress = f.status === 'delayed' && delay > 0
        ? '<div class="delay-progress">' +
            '<div class="delay-progress-label"><span>' + escapeHtml(t('delayProgress')) + '</span><strong>+' + delay + ' ' + escapeHtml(t('min')) + '</strong></div>' +
            '<div class="delay-progress-track" role="meter" aria-label="' + escapeHtml(t('delayProgress')) + '" aria-valuemin="0" aria-valuemax="120" aria-valuenow="' + Math.min(delay, 120) + '" aria-valuetext="+' + delay + ' ' + escapeHtml(t('min')) + '">' +
              '<span style="width:' + Math.min(delay / 120 * 100, 100) + '%"></span>' +
            '</div>' +
          '</div>'
        : '';
      return (
        '<div class="reason-head">' +
          '<h2 class="reason-title">' + escapeHtml(title) + '</h2>' +
        '</div>' +
        '<p class="reason-text">' + escapeHtml(f.controllerMessage || t('reason_' + f.reasonKey)) + '</p>' +
        progress +
        (f.controllerMessage ? '' : '<p class="reason-detail">' + escapeHtml(t('detail_' + f.reasonKey)) + '</p>')
      );
    }

    /* =========================================================
       FLIGHT DETAILS CARD
       ========================================================= */
    function buildCard(f, sev) {
      const depDelay = delayInfo(f.departure.scheduled, f.departure.time);
      const arrDelay = delayInfo(f.arrival.scheduled, f.arrival.time);
      const depLabel = f.departure.timeType === 'actual' ? t('actual') : t('estimated');
      const arrLabel = f.arrival.timeType === 'actual' ? t('actual') : t('estimated');

      const routeCol =
        '<div class="col">' +
          '<h3 class="col-title">' + escapeHtml(t('routeSchedule')) + '</h3>' +
          '<div class="route-visual">' + ICONS.plane + ICONS.dotted + ICONS.pin + '</div>' +
          '<div class="route-codes"><span>' + escapeHtml(f.origin.code) + '</span><span>' + escapeHtml(f.destination.code) + '</span></div>' +
          '<div class="route-cities"><span>' + escapeHtml(cityLabel(f.origin)) + '</span><span>' + escapeHtml(cityLabel(f.destination)) + '</span></div>' +
          field(t('date'), escapeHtml(formatDate(f.departure.date))) +
          field(t('scheduled'), escapeHtml(f.arrival.scheduled === '—' ? f.departure.scheduled : f.departure.scheduled + ' – ' + f.arrival.scheduled), 'time') +
        '</div>';

      function legCol(titleKey, leg, timeLabel, delay, code) {
        return (
          '<div class="col">' +
            '<h3 class="col-title">' + escapeHtml(t(titleKey)) + '</h3>' +
            field(t('date'), escapeHtml(formatDate(leg.date))) +
            field(t('scheduled'), escapeHtml(leg.scheduled), 'time') +
            field(timeLabel,
              escapeHtml(leg.time || '—') +
              (delay.label ? '<span class="delta">(' + escapeHtml(delay.label) + ')</span>' : ''),
              'time ' + delay.cls) +
            field(t('airport'), escapeHtml(code), 'airport-code') +
          '</div>'
        );
      }

      return (
        '<article class="flight-card" data-flight-id="' + escapeHtml(f.id) + '">' +
          '<div class="card-head">' +
            '<div class="flight-no"><span>' + escapeHtml(t('flight')) + '</span>' + escapeHtml(f.flightNo) + '</div>' +
          '</div>' +
          '<div class="card-grid">' +
            routeCol +
            legCol('departure', f.departure, depLabel, depDelay, f.origin.code) +
            legCol('arrival', f.arrival, arrLabel, arrDelay, f.destination.code) +
          '</div>' +
        '</article>'
      );
    }

    /* =========================================================
       RENDER
       ========================================================= */
    function renderFlights(language) {
      if (language && TRANSLATIONS[language]) state.language = language;
      document.documentElement.lang = state.language;
      document.title = t('documentTitle');

      const f = getCurrentFlight();

      els.pageEyebrow.textContent = t('eyebrow');
      els.flightNumberLabel.textContent = t('flightNumberLabel');
      els.flightNumberInput.placeholder = t('flightNumberPlaceholder');
      els.lastUpdated.textContent = fill(t('lastUpdated'), { time: formatClock(state.lastUpdated) });
      els.refreshLabel.textContent = state.isBusy ? t('refreshing') : t('refresh');
      els.langMenuTitle.textContent = t('menuTitle');
      els.langMenuSubtitle.textContent = t('menuSubtitle');
      els.langNameEnglish.textContent = t('languageEnglish');
      els.langNameChinese.textContent = t('languageTraditionalChinese');
      els.langNameJapanese.textContent = t('languageJapanese');
      els.translateButtonLabel.textContent = t('translateButtonLabel');
      els.detailsTitle.textContent = t('flightDetails');
      els.translatedChip.classList.toggle('is-visible', state.language !== 'en');
      els.translatedChipText.textContent = t('translatedChip');
      if (els.flightNumberInput !== document.activeElement) els.flightNumberInput.value = state.pendingFlightNumber;

      if (!f) return;

      els.pageTitle.textContent = fill(t('routeTitle'), {
        from: cityLabel(f.origin), fromCode: f.origin.code,
        to: cityLabel(f.destination), toCode: f.destination.code
      });

      const sev = getSeverity(f);

      els.hero.className = 'hero sev-' + sev + (state.compact ? ' is-compact' : '');
      els.hero.innerHTML = buildHero(f, sev);

      els.reasonCard.className = 'reason-card sev-' + sev;
      els.reasonCard.innerHTML = buildReason(f, sev);

      els.container.innerHTML = buildCard(f, sev);
      updateCompensationPrompt(f);

      els.langOptions.forEach(function (btn) {
        btn.setAttribute('aria-checked', btn.getAttribute('data-lang') === state.language ? 'true' : 'false');
      });
    }

    /* =========================================================
       SHRINK HERO ON SCROLL
       Hysteresis (two thresholds) prevents flicker at the boundary.
       ========================================================= */
    const COMPACT_NEAR_TOP = 28;
    const EXPAND_BELOW_TOP = 100;
    let scrollTicking = false;

    function updateCompact() {
      scrollTicking = false;
      const top = els.hero.getBoundingClientRect().top;
      let next = state.compact;
      if (!state.compact && top <= COMPACT_NEAR_TOP) next = true;
      else if (state.compact && top > EXPAND_BELOW_TOP) next = false;
      if (next !== state.compact) {
        state.compact = next;
        els.hero.classList.toggle('is-compact', next);
      }
    }

    window.addEventListener('scroll', function () {
      if (!scrollTicking) {
        scrollTicking = true;
        window.requestAnimationFrame(updateCompact);
      }
    }, { passive: true });

    /* =========================================================
       MOCK API CALLS
       ========================================================= */

    // TODO: Replace with real flight status API call (HK Express / Cathay ops data).
    function fetchFlightStatus() {
      return new Promise(function (resolve) {
        setTimeout(function () { resolve(MOCK_DATA); }, 1000);
      });
    }

    function mockTranslateApi(lang) {
      return new Promise(function (resolve) {
        setTimeout(function () { resolve(TRANSLATIONS[lang] || TRANSLATIONS.en); }, 450);
      });
    }

    function translateUi(lang) {
      if (!GOOGLE_TRANSLATION_ENDPOINT) return mockTranslateApi(lang);

      const entries = Object.entries(TRANSLATIONS.en).filter(function (entry) {
        return entry[0] !== 'locale' && entry[0] !== 'langName' && typeof entry[1] === 'string';
      });
      const passengerMessage = state.publishedUpdate && state.publishedUpdate.passengerMessage;
      const controllerMessage = typeof passengerMessage === 'string'
        ? passengerMessage
        : passengerMessage && passengerMessage.en;
      const contents = entries.map(function (entry) { return entry[1]; });
      if (controllerMessage) contents.push(controllerMessage);

      return fetch(GOOGLE_TRANSLATION_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: contents,
          targetLanguageCode: lang,
          mimeType: 'text/plain'
        })
      }).then(function (response) {
        if (!response.ok) throw new Error('Translation service returned HTTP ' + response.status + '.');
        return response.json();
      }).then(function (data) {
        if (!data || !Array.isArray(data.translations) ||
            data.translations.length !== contents.length ||
            data.translations.some(function (item) { return !item || typeof item.translatedText !== 'string'; })) {
          throw new Error('Translation service returned an invalid response.');
        }

        const translated = Object.assign({}, TRANSLATIONS[lang] || TRANSLATIONS.en);
        entries.forEach(function (entry, index) {
          translated[entry[0]] = data.translations[index].translatedText;
        });
        state.apiTranslations[lang] = translated;
        if (controllerMessage) state.apiControllerMessages[lang] = data.translations[entries.length].translatedText;
        return translated;
      });
    }

    /* =========================================================
       ACTIONS
       ========================================================= */
    function setLoading(isLoading) {
      state.isBusy = isLoading;
      els.content.classList.toggle('is-loading', isLoading);
      els.content.setAttribute('aria-busy', isLoading ? 'true' : 'false');
    }

    function handleRefresh() {
      if (state.isBusy) return;
      state.pendingFlightNumber = els.flightNumberInput.value.trim().toUpperCase() || MOCK_DATA[0].flightNo;
      setLoading(true);
      els.refreshBtn.disabled = true;
      els.refreshBtn.classList.add('is-loading');
      els.refreshLabel.textContent = t('refreshing');

      fetchFlightStatus().then(function () {
        state.publishedUpdate = readControllerUpdate(state.pendingFlightNumber);
        state.apiControllerMessages = {};
        state.flightNumber = state.publishedUpdate
          ? state.publishedUpdate.flightNumber
          : state.pendingFlightNumber;
        state.pendingFlightNumber = state.flightNumber;
        localStorage.setItem('passengerFlightNumber', state.flightNumber);
        if (!state.publishedUpdate) state.scenario = 'diverted';
        state.lastUpdated = new Date();
        setLoading(false);
        els.refreshBtn.disabled = false;
        els.refreshBtn.classList.remove('is-loading');
        renderFlights(state.language);
        showToast(t('refreshed'));
      });
    }

    function handleLanguageChange(lang) {
      closeMenu();
      if (!TRANSLATIONS[lang] || state.isBusy || lang === state.language) return;

      setLoading(true);
      els.fabBtn.classList.add('is-busy');
      showToast(TRANSLATIONS[lang].translating);

      translateUi(lang).then(function (dict) {
        state.language = lang;
        showToast(fill(dict.translatedTo, { lang: dict.langName }));
      }).catch(function (error) {
        showToast('Translation failed: ' + error.message);
      }).finally(function () {
        setLoading(false);
        els.fabBtn.classList.remove('is-busy');
        renderFlights(state.language);
      });
    }

    /* =========================================================
       LANGUAGE MENU
       ========================================================= */
    function openMenu() {
      els.langMenu.classList.add('is-open');
      els.fabBtn.setAttribute('aria-expanded', 'true');
      const active = els.langMenu.querySelector('.lang-option[aria-checked="true"]');
      if (active) active.focus();
    }

    function closeMenu() {
      els.langMenu.classList.remove('is-open');
      els.fabBtn.setAttribute('aria-expanded', 'false');
    }

    /* =========================================================
       EVENT LISTENERS
       ========================================================= */
    els.refreshBtn.addEventListener('click', handleRefresh);
    els.compensationClose.addEventListener('click', function () {
      els.compensationDialog.close();
    });
    els.compensationForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const selected = els.compensationForm.querySelector('input[name="supportOption"]:checked');
      if (!selected) return;
      const optionKey = els.compensationOptions.querySelectorAll('.compensation-option span')[Number(selected.value)];
      showToast(fill(t('compSelected'), { option: optionKey.textContent }));
      els.compensationDialog.close();
    });

    els.fabBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (els.langMenu.classList.contains('is-open')) closeMenu(); else openMenu();
    });

    els.langOptions.forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        handleLanguageChange(btn.getAttribute('data-lang'));
      });
    });

    els.flightNumberInput.addEventListener('input', function () {
      state.pendingFlightNumber = els.flightNumberInput.value.trim().toUpperCase() || MOCK_DATA[0].flightNo;
    });
    els.flightNumberInput.addEventListener('blur', function () {
      state.pendingFlightNumber = els.flightNumberInput.value.trim().toUpperCase() || MOCK_DATA[0].flightNo;
      els.flightNumberInput.value = state.pendingFlightNumber;
    });

    document.addEventListener('click', function (e) {
      if (!els.fab.contains(e.target)) closeMenu();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && els.langMenu.classList.contains('is-open')) {
        closeMenu();
        els.fabBtn.focus();
      }
    });

    /* =========================================================
       INIT
       ========================================================= */
    renderFlights('en');
    updateCompact();
  })();
  </script>
</body>
</html>
